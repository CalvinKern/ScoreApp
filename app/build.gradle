apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'kotlin-parcelize'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk = 37

    defaultConfig {
        applicationId "com.seakernel.scorepad"
        minSdk 24
        targetSdk 37
        versionCode 19
        versionName "1.7.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    buildFeatures {
        viewBinding true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [appName: "Score Pad"]

            ndk.debugSymbolLevel = 'full'
            firebaseCrashlytics {
                // Only signed builds (Android Studio's Generate Signed Bundle / APK) upload R8's mapping file, or any
                // build with -PuploadCrashlyticsMapping, so test builds of release don't send one for an APK no one runs
                mappingFileUploadEnabled project.hasProperty('android.injected.signing.store.file') ||
                    project.hasProperty('uploadCrashlyticsMapping')
            }
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            manifestPlaceholders = [appName: "Score Pad (Debug)"]

            // Speed up debug builds, don't need debug symbols
            ndk.debugSymbolLevel = 'none'
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
    }

    namespace 'com.seakernel.android.scoreapp'
}

kotlin {
    jvmToolchain(21)
}

apply from: "$rootDir/gradle/emulator-lock.gradle"

ext {
    MOBIUS_VERSION = '2.1.2'
    ROOM_VERSION = '2.8.4'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Androidx
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation "androidx.core:core-ktx:1.19.1"
    implementation "androidx.fragment:fragment-ktx:1.9.1"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    // Material brings in 1.5.0, which drops a back press that finishes a screen transition before it has started,
    // leaving the previous screen never shown (fixed in 1.5.1)
    implementation "androidx.transition:transition:1.7.2"
    implementation "com.google.android.material:material:1.14.0"
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:review-ktx:2.0.2'

    // Firebase
    implementation 'com.google.firebase:firebase-analytics:24.0.0'
    implementation 'com.google.firebase:firebase-crashlytics:21.0.0'

    // Testing
    testImplementation "junit:junit:4.13.2"
    // ThreeTenABP's time zone data only loads on Android, local unit tests need the full library
    testImplementation "org.threeten:threetenbp:1.7.5"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"

    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Room
    implementation "androidx.room:room-runtime:$ROOM_VERSION"
    ksp "androidx.room:room-compiler:$ROOM_VERSION"
    testImplementation "androidx.room:room-testing:$ROOM_VERSION"
    androidTestImplementation "androidx.room:room-testing:$ROOM_VERSION"

    configurations.configureEach {
        resolutionStrategy {
            force "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1"
        }
    }

    // Mobius
    implementation "com.spotify.mobius:mobius-core:$MOBIUS_VERSION"
    testImplementation "com.spotify.mobius:mobius-test:$MOBIUS_VERSION"
    implementation "com.spotify.mobius:mobius-android:$MOBIUS_VERSION"
    implementation "com.spotify.mobius:mobius-extras:$MOBIUS_VERSION"

    // Misc.
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.9'
    implementation("com.github.hadilq:live-event:1.3.0") {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
    }
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'nl.dionsegijn:konfetti-xml:2.1.0'
}
apply plugin: 'com.google.gms.google-services'
